apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reflections
  namespace: argocd
spec:
  destination:
    namespace: reflections
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      valueFiles:
        - values-prod.yaml
    path: helm/reflections
    repoURL: https://git.shadyknollcave.io/micro/reflections.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
