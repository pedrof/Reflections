{{- if not .Values.backend.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reflections.fullname" . }}-secrets
  namespace: {{ .Values.namespace.name }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.backend.databaseUrl | default "" | quote }}
  JWT_SECRET: {{ .Values.backend.jwtSecret | default "" | quote }}
  AI_API_KEY: {{ .Values.backend.aiApiKey | default "" | quote }}
  OAUTH2_CLIENT_ID: {{ .Values.backend.oauth2ClientId | default "" | quote }}
  OAUTH2_CLIENT_SECRET: {{ .Values.backend.oauth2ClientSecret | default "" | quote }}
  OAUTH2_ISSUER_URL: {{ .Values.backend.oauth2IssuerUrl | default "" | quote }}
  OAUTH2_REDIRECT_URI: {{ .Values.backend.oauth2RedirectUri | default "" | quote }}
  POSTGRES_PASSWORD: {{ .Values.backend.postgresPassword | default "" | quote }}
  POSTGRES_USER: {{ .Values.backend.postgresUser | default "reflections" | quote }}
{{- end }}
